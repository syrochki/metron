services:
  web:
    build:
      context: .
      dockerfile: dockerfiles/dev/Dockerfile
    container_name: metron-web
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: ${DEBUG}
      # SECRET_KEY: ${SECRET_KEY}
      # HEALTH_CHECK_SECRET_TOKEN: ${HEALTH_CHECK_SECRET_TOKEN}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL}

      CACHE_HOST: ${CACHE_HOST}
      CACHE_PORT: ${CACHE_PORT}
    volumes:
      - ./src:/app/src
      - sqlite_data:/app/data
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --appendonly yes
    container_name: metron-valkey
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  sqlite_data:
  valkey_data:
