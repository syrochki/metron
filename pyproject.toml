[project]
name = "metron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Timothy Zykov", email = "syr0chk1@proton.me" }
]
requires-python = ">=3.14, <3.15"
dependencies = [
    "channels>=4.3.2",
    "daphne>=4.2.3",
    "django>=6.1.2",
    "django-csp>=4.0",
    "django-liveview>=2.5.0",
    "django-stubs-ext>=6.1.2",
    "whitenoise>=6.12.0",
]

[project.scripts]
metron = "metron.manage:main"

[build-system]
requires = ["uv_build>=0.13.1, <0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "types-channels>=4.3.0.20260518",
]
lint = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]
test = [
    "pytest-django[django]>=4.14.0",
]

[tool.django-stubs]
django_settings_module = "metron.server.settings"

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = [
    "migrations",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[[tool.mypy.overrides]]
module = [
    "annotated_types.*",
    "msgspec.*",
    "health_check.*",
]

[tool.ruff]
exclude = [
    "migrations",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
