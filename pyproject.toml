[project]
name = "metron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Timothy Zykov", email = "syr0chk1@proton.me" }
]
requires-python = ">=3.14, <3.15"
dependencies = [
    "django-modern-rest[msgspec,openapi]>=0.16.0",
    "django-stubs-ext>=6.1.2",
]

[project.scripts]
metron = "metron:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = " test" },
]
lint = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]
test = [
    "pytest-django[django]>=4.14.0",
]
